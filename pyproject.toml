[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minigameengine"
version = "0.7.0"
description = "Mini Game Engine"
readme = "README.md"
license = { text = "MIT" }

authors = [
    { name = "Roberto Carrasco", email = "titos.carrasco@gmail.com" }
]

maintainers = [
    { name = "Roberto Carrasco", email = "titos.carrasco@gmail.com" }
]

requires-python = ">=3.8"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["MiniGameEngine"]